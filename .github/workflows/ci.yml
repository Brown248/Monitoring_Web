# ตรวจ (typecheck · lint · format · test กับ PostgreSQL จริง) → ผ่านแล้วค่อย build image ขึ้น GitHub Packages (ghcr.io)
# VM ดึง image ใหม่เองด้วย scripts/auto-update.sh — commit ที่เทสต์ไม่ผ่านจะไม่มีวันขึ้น VM
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: monitor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor -d monitor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://monitor:ci-only-password@127.0.0.1:5432/monitor_test
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # เวอร์ชันจาก "packageManager" ใน package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  images:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - name: ชื่อ image (ghcr ต้องเป็นตัวพิมพ์เล็ก)
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monitoring-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          # latest = รุ่นล่าสุดที่ VM ดึง · sha-xxxxxxx = ไว้ย้อนรุ่น (IMAGE_TAG ใน .env)
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
